<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Coding & Hackathon Portal</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--primary:#315efb;--primary2:#2449d8;--danger:#dc3545;--success:#16834b;--border:#e5e7eb;--shadow:0 10px 30px rgba(16,24,40,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
    .auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef3ff,#f8fbff)}
    .auth-card{width:min(430px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:28px}.brand{text-align:center;margin-bottom:24px}.brand .logo{font-size:42px}.brand h1{margin:8px 0 4px;font-size:25px}.brand p{margin:0;color:var(--muted)}
    .tabs{display:flex;gap:8px;background:#f2f4f7;padding:5px;border-radius:12px;margin-bottom:18px}.tab{flex:1;padding:11px;border-radius:9px;background:transparent;color:var(--muted);font-weight:700}.tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:10px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(49,94,251,.12)}
    .btn{padding:11px 15px;border-radius:10px;font-weight:700}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}.btn-secondary{background:#eef2f6;color:#344054}.btn-danger{background:#fee4e6;color:#b42318}.btn-success{background:#e8f7ef;color:#067647}.btn-small{padding:7px 10px;font-size:12px}.full{width:100%}
    .message{padding:11px 13px;border-radius:10px;margin:12px 0;font-size:13px}.message.error{background:#fff0f1;color:#b42318}.message.success{background:#eaf8f0;color:#067647}.message.info{background:#eef4ff;color:#1d4ed8}
    .app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.topbar-title{font-weight:800}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#e8edff;color:var(--primary);display:grid;place-items:center;font-weight:800}.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:230px;background:#fff;border-right:1px solid var(--border);padding:16px}.navbtn{width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:10px;color:#475467;margin-bottom:4px;font-weight:700}.navbtn.active,.navbtn:hover{background:#eef3ff;color:var(--primary)}.content{flex:1;padding:24px;max-width:1500px;margin:auto;width:100%}
    .page-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.page-title h2{margin:0;font-size:24px}.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 3px 15px rgba(16,24,40,.04)}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .value{font-size:28px;font-weight:800;margin-top:8px}.cards{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 3px 15px rgba(16,24,40,.04)}.card h3{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f6;color:#475467}.status.active{background:#eaf8f0;color:#067647}.status.inactive{background:#f2f4f7;color:#667085}.response{margin-top:15px;padding-top:14px;border-top:1px solid var(--border)}.response-row{display:flex;gap:8px}.response-row .btn{flex:1}.locked{font-size:12px;color:#067647;font-weight:700;background:#eaf8f0;padding:9px;border-radius:9px}
    .panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full-span{grid-column:1/-1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:30px}.loader{position:fixed;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center;z-index:100}.spinner{width:40px;height:40px;border:4px solid #dbe2ff;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:18px;z-index:80}.modal-card{background:#fff;width:min(560px,100%);border-radius:18px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0}.close{background:#f2f4f7;width:34px;height:34px;border-radius:50%;font-size:20px}
    @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.sidebar{width:190px}}@media(max-width:680px){.layout{display:block}.sidebar{width:100%;border-right:0;border-bottom:1px solid var(--border);display:flex;overflow:auto;gap:5px}.navbtn{min-width:max-content;width:auto}.content{padding:16px}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.form-grid .full-span{grid-column:auto}.topbar{padding:0 14px}.topbar-title{font-size:14px}.userbox .user-name{display:none}}
  </style>
</head>
<body>
  <div id="loader" class="loader hidden"><div class="spinner"></div></div>

  <section id="authView" class="auth">
    <div class="auth-card">
      <div class="brand"><div class="logo">💻</div><h1>Student Coding & Hackathon Portal</h1><p>Contest registration and student services</p></div>
      <div class="tabs"><button id="studentTab" class="tab active" onclick="switchLogin('student')">Student</button><button id="authorityTab" class="tab" onclick="switchLogin('authority')">Authority</button></div>
      <div id="loginMessage"></div>
      <form id="studentLoginForm" onsubmit="loginStudentUI(event)">
        <div class="field"><label>Register Number</label><input id="studentReg" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input id="studentPass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary full" type="submit">Login as Student</button>
      </form>
      <form id="authorityLoginForm" class="hidden" onsubmit="loginAuthorityUI(event)">
        <div class="field"><label>Username</label><input id="authorityUser" autocomplete="username"></div>
        <div class="field"><label>Password</label><input id="authorityPass" type="password" autocomplete="current-password"></div>
        <button class="btn btn-primary full" type="submit">Login as Authority</button>
      </form>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <header class="topbar"><div class="topbar-title">💻 Coding & Hackathon Portal</div><div class="userbox"><div class="avatar" id="avatar">U</div><div class="user-name" id="userName">User</div><button class="btn btn-secondary btn-small" onclick="logoutUI()">Logout</button></div></header>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="mainContent"></main>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Details</h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
  const state = { token: sessionStorage.getItem('portalToken') || '', type: sessionStorage.getItem('portalType') || '', user: null, currentPage: 'dashboard' };
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmtDate = v => v ? new Date(v).toLocaleString() : '-';
  const showLoader = v => $('loader').classList.toggle('hidden', !v);
  function showMsg(text,type='error',target='loginMessage'){ $(target).innerHTML = `<div class="message ${type}">${esc(text)}</div>`; }
  function clearMsg(target='loginMessage'){ $(target).innerHTML=''; }

  const API_URL = '/api/server';

async function callServer(fn, ...args) {
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      fn: fn,
      args: args
    })
  });

  let result;

  try {
    result = await response.json();
  } catch (e) {
    throw new Error('Invalid response from server.');
  }

  if (!response.ok) {
    throw new Error(result.message || 'Server request failed.');
  }

  return result;
}
  async function server(fn, ...args) {
    try {
        const r = await callServer(fn, ...args);

        if (!r || r.success !== true) {
            const m = r?.message || 'Server request failed.';
            throw new Error(m);
        }

        return r.data;

    } catch (e) {
        throw e;
    }
}
  function forceLogin(msg){ state.token='';state.type='';state.user=null;sessionStorage.removeItem('portalToken');sessionStorage.removeItem('portalType');$('appView').classList.add('hidden');$('authView').classList.remove('hidden');if(msg)showMsg(msg,'error'); }

  function switchLogin(type){
    $('studentTab').classList.toggle('active',type==='student'); $('authorityTab').classList.toggle('active',type==='authority');
    $('studentLoginForm').classList.toggle('hidden',type!=='student'); $('authorityLoginForm').classList.toggle('hidden',type!=='authority'); clearMsg();
  }
  async function loginStudentUI(e){
    e.preventDefault(); clearMsg(); showLoader(true);
    try{ const d=await server('loginStudent',$('studentReg').value.trim(),$('studentPass').value); state.token=d.sessionToken;state.type='STUDENT';state.user=d.student;sessionStorage.setItem('portalToken',state.token);sessionStorage.setItem('portalType',state.type);openApp();await renderStudentDashboard(); }
    catch(err){ showMsg(err.message); } finally{showLoader(false);}
  }
  async function loginAuthorityUI(e){
    e.preventDefault(); clearMsg(); showLoader(true);
    try{ const d=await server('loginAuthority',$('authorityUser').value.trim(),$('authorityPass').value); state.token=d.sessionToken;state.type='AUTHORITY';state.user=d;sessionStorage.setItem('portalToken',state.token);sessionStorage.setItem('portalType',state.type);openApp();await renderAuthorityDashboard(); }
    catch(err){ showMsg(err.message); } finally{showLoader(false);}
  }
  function openApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('userName').textContent=state.type==='STUDENT'?(state.user.name||'Student'):(state.user.name||state.user.username||'Authority');$('avatar').textContent=($('userName').textContent||'U').charAt(0).toUpperCase(); buildSidebar(); }
  function buildSidebar(){
    const items=state.type==='STUDENT'?[['dashboard','Dashboard','🏠'],['contests','Contests','🏆'],['requests','My Requests','📝']]:[['dashboard','Dashboard','🏠'],['students','Students','👥'],['contests','Contests','🏆'],['requests','Requests','📋']];
    $('sidebar').innerHTML=items.map(x=>`<button class="navbtn ${state.currentPage===x[0]?'active':''}" onclick="navigate('${x[0]}')">${x[2]} &nbsp; ${x[1]}</button>`).join('');
  }
  async function navigate(page){ state.currentPage=page;buildSidebar();showLoader(true);try{if(state.type==='STUDENT'){if(page==='dashboard'||page==='contests')await renderStudentDashboard();else await renderStudentRequests();}else{if(page==='dashboard')await renderAuthorityDashboard();else if(page==='students')await renderStudents();else if(page==='contests')await renderAuthorityContests();else await renderAuthorityRequests();}}catch(e){$('mainContent').innerHTML=`<div class="message error">${esc(e.message)}</div>`;}finally{showLoader(false);}}

  async function renderStudentDashboard(){
    const d=await server('getStudentDashboard',state.token);state.user=d.student;openApp();
    $('mainContent').innerHTML=`<div class="page-title"><div><h2>Welcome, ${esc(d.student.name)}</h2><p>Register No: ${esc(d.student.regNo)} · Year ${esc(d.student.year)} · ${esc(d.student.classSec)}</p></div></div>
      <div class="grid stats"><div class="stat"><div class="label">Registered</div><div class="value">${d.registeredCount}</div></div><div class="stat"><div class="label">Not Registered</div><div class="value">${d.notRegisteredCount}</div></div><div class="stat"><div class="label">No Response</div><div class="value">${d.noResponseCount}</div></div><div class="stat"><div class="label">Total Contests</div><div class="value">${d.contests.length}</div></div></div>
      <div class="panel" style="margin-top:16px"><h3>My Profile</h3><div class="form-grid"><div><span class="muted">Roll No</span><br><b>${esc(d.student.rollNo)}</b></div><div><span class="muted">Register No</span><br><b>${esc(d.student.regNo)}</b></div><div><span class="muted">Year</span><br><b>${esc(d.student.year)}</b></div><div><span class="muted">Class / Section</span><br><b>${esc(d.student.classSec)}</b></div></div></div>
      <div class="page-title" style="margin-top:24px"><div><h2>Contests</h2><p>Each contest response is saved once and cannot be overwritten.</p></div></div><div id="studentContestCards" class="grid cards"></div>`;
    renderStudentContestCards(d.contests);
  }
  function renderStudentContestCards(contests){
    const box=$('studentContestCards'); if(!contests.length){box.innerHTML='<div class="card empty">No contests available.</div>';return;}
    box.innerHTML=contests.map(c=>{const active=c.status==='ACTIVE';let response='';if(c.studentResponse==='NO_RESPONSE'){response=active?`<div class="response"><div class="muted" style="margin-bottom:8px">Will you participate?</div><div class="response-row"><button class="btn btn-success" onclick="submitResponse('${esc(c.contestId)}','YES',this)">Yes</button><button class="btn btn-danger" onclick="submitResponse('${esc(c.contestId)}','NO',this)">No</button></div></div>`:`<div class="locked">Contest is inactive.</div>`;}else{response=`<div class="locked">Response saved: ${esc(c.studentResponse)} · This response is locked.</div>`;}return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${esc(c.contestName)}</h3><span class="status ${active?'active':'inactive'}">${esc(c.status)}</span></div><p class="muted">${esc(c.description||'No description')}</p><p class="muted">Registered: <b>${Number(c.registeredCount)||0}</b></p><a class="btn btn-secondary btn-small" href="${esc(c.contestLink)}" target="_blank" rel="noopener">Open Contest</a>${response}</div>`}).join('');
  }
  async function submitResponse(id,response,btn){
    if(!confirm(`Submit ${response} for this contest? You can answer this contest only once.`))return;
    showLoader(true);try{const d=await server('submitContestResponse',state.token,id,response);showMsg(d.message,'success','loginMessage');await renderStudentDashboard();}catch(e){alert(e.message);}finally{showLoader(false);}
  }

  async function renderStudentRequests(){
    const reqs=await server('getMyRequests',state.token);
    $('mainContent').innerHTML=`<div class="page-title"><div><h2>My Correction Requests</h2><p>Submit profile correction requests and track authority decisions.</p></div></div>
      <div class="panel"><h3>New Request</h3><div id="requestMessage"></div><form onsubmit="createRequestUI(event)"><div class="form-grid"><div class="field"><label>Request Type</label><select id="reqType" required><option value="PROFILE">Profile correction</option><option value="NAME">Name correction</option><option value="CLASS">Class / section correction</option><option value="YEAR">Year correction</option><option value="OTHER">Other</option></select></div><div class="field"><label>Requested Change</label><input id="reqChange" required placeholder="Example: Change name to ..."></div><div class="field full-span"><label>Reason</label><textarea id="reqReason" rows="3" required></textarea></div></div><button class="btn btn-primary" type="submit">Submit Request</button></form></div>
      <div class="panel"><h3>Request History</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Requested Change</th><th>Status</th><th>Authority Response</th></tr></thead><tbody>${reqs.length?reqs.map(r=>`<tr><td>${esc(fmtDate(r.date))}</td><td>${esc(r.type)}</td><td>${esc(r.requestedChange)}</td><td><span class="status">${esc(r.status)}</span></td><td>${esc(r.authorityResponse||'-')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No requests yet.</td></tr>'}</tbody></table></div></div>`;
  }
  async function createRequestUI(e){e.preventDefault();showLoader(true);try{const d=await server('createCorrectionRequest',state.token,$('reqType').value,$('reqChange').value,$('reqReason').value);showMsg('Request submitted successfully. ID: '+d.requestId,'success','requestMessage');$('reqChange').value='';$('reqReason').value='';setTimeout(()=>navigate('requests'),700);}catch(err){showMsg(err.message,'error','requestMessage');}finally{showLoader(false);}}

  async function renderAuthorityDashboard(){
    const d=await server('getAuthorityDashboard',state.token);openApp();
    $('mainContent').innerHTML=`<div class="page-title"><div><h2>Authority Dashboard</h2><p>Welcome, ${esc(state.user.name||state.user.username)} · Role: ${esc(state.user.role)}</p></div></div><div class="grid stats"><div class="stat"><div class="label">Students</div><div class="value">${d.totalStudents}</div></div><div class="stat"><div class="label">Contests</div><div class="value">${d.totalContests}</div></div><div class="stat"><div class="label">YES Responses</div><div class="value">${d.totalResponses}</div></div><div class="stat"><div class="label">Pending Requests</div><div class="value">${d.pendingRequests}</div></div></div><div class="panel" style="margin-top:16px"><h3>Quick Actions</h3><div class="actions"><button class="btn btn-primary" onclick="navigate('students')">Manage Students</button><button class="btn btn-primary" onclick="navigate('contests')">Manage Contests</button><button class="btn btn-secondary" onclick="navigate('requests')">Review Requests</button></div></div>`;
  }

  async function renderStudents(){
    const students=await server('getStudents',state.token);
    $('mainContent').innerHTML=`<div class="page-title"><div><h2>Student Management</h2><p>Add students, reset passwords, or remove a student.</p></div><button class="btn btn-primary" onclick="openAddStudent()">+ Add Student</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Roll No</th><th>Year</th><th>Class</th><th>Register No</th><th>Name</th><th>Actions</th></tr></thead><tbody>${students.length?students.map(s=>`<tr><td>${esc(s.rollNo)}</td><td>${esc(s.year)}</td><td>${esc(s.classSec)}</td><td>${esc(s.regNo)}</td><td>${esc(s.name)}</td><td><div class="actions"><button class="btn btn-secondary btn-small" onclick="resetPassword('${esc(s.regNo)}')">Reset Password</button><button class="btn btn-danger btn-small" onclick="deleteStudentUI('${esc(s.regNo)}')">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No students found.</td></tr>'}</tbody></table></div></div>`;
  }
  function openAddStudent(){openModal('Add Student',`<div id="studentFormMsg"></div><form onsubmit="addStudentUI(event)"><div class="form-grid"><div class="field"><label>Roll No</label><input id="newRoll" required></div><div class="field"><label>Year</label><input id="newYear" required></div><div class="field"><label>Class / Section</label><input id="newClass" required></div><div class="field"><label>Register No</label><input id="newReg" required></div><div class="field full-span"><label>Name</label><input id="newName" required></div><div class="field full-span"><label>Password</label><input id="newPassword" type="password" required></div></div><button class="btn btn-primary" type="submit">Add Student</button></form>`);}
  async function addStudentUI(e){e.preventDefault();showLoader(true);try{await server('addStudent',state.token,{rollNo:$('newRoll').value,year:$('newYear').value,classSec:$('newClass').value,regNo:$('newReg').value,name:$('newName').value,password:$('newPassword').value});closeModal();alert('Student added successfully.');await renderStudents();}catch(err){showMsg(err.message,'error','studentFormMsg');}finally{showLoader(false);}}
  async function resetPassword(reg){const p=prompt('Enter the new password for '+reg+':');if(!p)return;showLoader(true);try{await server('resetStudentPassword',state.token,reg,p);alert('Password reset successfully.');}catch(e){alert(e.message);}finally{showLoader(false);}}
  async function deleteStudentUI(reg){if(!confirm('Delete student '+reg+'? This cannot be undone.'))return;showLoader(true);try{await server('deleteStudent',state.token,reg);await renderStudents();}catch(e){alert(e.message);}finally{showLoader(false);}}

  async function renderAuthorityContests(){
    const contests=await server('getContests',state.token);
    $('mainContent').innerHTML=`<div class="page-title"><div><h2>Contest Management</h2><p>Create and monitor contests. Student answers are stored in the Students sheet.</p></div><button class="btn btn-primary" onclick="openCreateContest()">+ Create Contest</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Contest</th><th>Status</th><th>Registered</th><th>Created</th><th>Actions</th></tr></thead><tbody>${contests.length?contests.map(c=>`<tr><td><b>${esc(c.contestName)}</b><br><span class="muted">${esc(c.contestId)}</span></td><td><span class="status ${c.status==='ACTIVE'?'active':'inactive'}">${esc(c.status)}</span></td><td>${Number(c.registeredCount)||0}</td><td>${esc(fmtDate(c.createdAt))}</td><td><div class="actions"><button class="btn btn-secondary btn-small" onclick="analytics('${esc(c.contestId)}','${esc(c.contestName)}')">Analytics</button>${c.status==='ACTIVE'?`<button class="btn btn-danger btn-small" onclick="deactivateContest('${esc(c.contestId)}')">Deactivate</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="5" class="empty">No contests found.</td></tr>'}</tbody></table></div></div>`;
  }
  function openCreateContest(){openModal('Create Contest',`<div id="contestFormMsg"></div><form onsubmit="createContestUI(event)"><div class="field"><label>Contest Name</label><input id="contestName" required></div><div class="field"><label>Contest Link</label><input id="contestLink" type="url" required placeholder="https://..."></div><div class="field"><label>Description</label><textarea id="contestDescription" rows="4"></textarea></div><button class="btn btn-primary" type="submit">Create Contest</button></form>`);}
  async function createContestUI(e){e.preventDefault();showLoader(true);try{await server('createContest',state.token,{contestName:$('contestName').value,contestLink:$('contestLink').value,description:$('contestDescription').value,status:'ACTIVE'});closeModal();alert('Contest created successfully.');await renderAuthorityContests();}catch(err){showMsg(err.message,'error','contestFormMsg');}finally{showLoader(false);}}
  async function deactivateContest(id){if(!confirm('Deactivate this contest? Existing stored responses will remain.'))return;showLoader(true);try{await server('deleteContest',state.token,id);await renderAuthorityContests();}catch(e){alert(e.message);}finally{showLoader(false);}}
  async function analytics(id,name){showLoader(true);try{const d=await server('getContestAnalytics',state.token,id);openModal('Analytics — '+name,`<div class="grid stats"><div class="stat"><div class="label">Total Students</div><div class="value">${d.totalStudents}</div></div><div class="stat"><div class="label">YES</div><div class="value">${d.yesCount}</div></div><div class="stat"><div class="label">NO</div><div class="value">${d.noCount}</div></div><div class="stat"><div class="label">No Response</div><div class="value">${d.noResponseCount}</div></div></div><div class="panel" style="margin-top:16px"><b>Registration Percentage: ${d.registrationPercentage}%</b></div>`);}catch(e){alert(e.message);}finally{showLoader(false);}}

  async function renderAuthorityRequests(){
    const reqs=await server('getAllRequests',state.token);
    $('mainContent').innerHTML=`<div class="page-title"><div><h2>Correction Requests</h2><p>Review and process student correction requests.</p></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Type</th><th>Requested Change</th><th>Reason</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>${reqs.length?reqs.map(r=>`<tr><td><b>${esc(r.studentName)}</b><br>${esc(r.studentRegNo)}</td><td>${esc(r.type)}</td><td>${esc(r.requestedChange)}</td><td>${esc(r.reason)}</td><td>${esc(fmtDate(r.date))}</td><td><span class="status">${esc(r.status)}</span></td><td>${r.status==='pending'?`<div class="actions"><button class="btn btn-success btn-small" onclick="processReq('${esc(r.requestId)}','approve')">Approve</button><button class="btn btn-danger btn-small" onclick="processReq('${esc(r.requestId)}','reject')">Reject</button></div>`:'<span class="muted">Processed</span>'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No requests found.</td></tr>'}</tbody></table></div></div>`;
  }
  async function processReq(id,action){const response=prompt(action==='approve'?'Enter approval response:':'Enter rejection reason:');if(!response)return;showLoader(true);try{if(action==='approve')await server('approveRequest',state.token,id,response);else await server('rejectRequest',state.token,id,response);await renderAuthorityRequests();}catch(e){alert(e.message);}finally{showLoader(false);}}

  function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.remove('hidden');}
  function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML='';}
  async function logoutUI(){try{if(state.token)await callServer('logout',state.token);}catch(_){}forceLogin('You have been logged out.');}

  async function boot(){
    if(!state.token){return;}
    showLoader(true);try{const r=await callServer('getMyProfile',state.token);if(!r.success)throw new Error(r.message||'Session invalid');state.type='STUDENT';state.user=r.data;openApp();await renderStudentDashboard();return;}catch(_){ }
    try{const r=await callServer('getAuthorityDashboard',state.token);if(!r.success)throw new Error(r.message||'Session invalid');state.type='AUTHORITY';state.user={name:'Authority'};openApp();await renderAuthorityDashboard();}catch(_){forceLogin();}finally{showLoader(false);}
  }
  window.addEventListener('load',boot);

// Keep reference to the original Students page renderer.
const originalRenderStudentsForEdit = renderStudents;


// Replace the Students page renderer with an enhanced version.
renderStudents = async function () {

  // First render the normal Students page.
  await originalRenderStudentsForEdit();

  // Find the students table.
  const table = document.querySelector('.table');

  if (!table) {
    return;
  }

  // Find table body.
  const tbody = table.querySelector('tbody');

  if (!tbody) {
    return;
  }

  // Add Edit button to every student row.
  const rows = tbody.querySelectorAll('tr');

  rows.forEach(function (row) {

    const cells = row.querySelectorAll('td');

    // Skip empty table row.
    if (cells.length < 6) {
      return;
    }

    // Existing actions cell.
    const actionsCell = cells[5];

    // Read student values from table.
    const rollNo = cells[0].textContent.trim();
    const year = cells[1].textContent.trim();
    const classSec = cells[2].textContent.trim();
    const regNo = cells[3].textContent.trim();
    const name = cells[4].textContent.trim();

    // Prevent duplicate Edit buttons.
    if (actionsCell.querySelector('.edit-student-btn')) {
      return;
    }

    const editButton = document.createElement('button');

    editButton.className =
      'btn btn-primary btn-small edit-student-btn';

    editButton.textContent = 'Edit';

    editButton.onclick = function () {

      openEditStudentModal({
        rollNo: rollNo,
        year: year,
        classSec: classSec,
        regNo: regNo,
        name: name
      });

    };

    const actions = actionsCell.querySelector('.actions');

    if (actions) {
      actions.prepend(editButton);
    } else {
      actionsCell.prepend(editButton);
    }

  });

};

          id="editOriginalRegNo"
          value="${esc(student.regNo)}"
        >

        <div class="form-grid">

          <div class="field">
            <label>Roll No</label>

              id="editRollNo"
              value="${esc(student.rollNo)}"
              required
            >
          </div>

          <div class="field">
            <label>Year</label>
            <input
              id="editYear"
              value="${esc(student.year)}"
              required
            >
          </div>

          <div class="field">
            <label>Class / Section</label>
            <input
              id="editClassSec"
              value="${esc(student.classSec)}"
              required
            >
          </div>

          <div class="field">
            <label>Register Number</label>
            <input
              id="editRegNo"
              value="${esc(student.regNo)}"
              required
            >
          </div>

          <div class="field full-span">

            <input

// =============================================================================
// SAVE EDITED STUDENT
// =============================================================================

async function saveEditedStudent(event) {

  event.preventDefault();

  const originalRegNo =
    $('editOriginalRegNo').value.trim();

  const updates = {

    rollNo:
      $('editRollNo').value.trim(),

    year:
      $('editYear').value.trim(),

    classSec:
      $('editClassSec').value.trim(),

    regNo:
      $('editRegNo').value.trim(),

    name:
      $('editStudentName').value.trim()

  };

  showLoader(true);

  try {

    const result =
      await server(
        'editStudentDetails',
        state.token,
        originalRegNo,
        updates
      );

    closeModal();

    alert(
      result.message ||
      'Student details updated successfully.'
    );

    // Reload Students table.
    await renderStudents();

  } catch (error) {

    showMsg(
      error.message,
      'error',
      'editStudentMessage'
    );

  } finally {

    showLoader(false);

  }
}
