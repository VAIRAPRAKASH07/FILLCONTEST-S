<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Coding & Hackathon Portal</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#667085;--primary:#315efb;--primary2:#2449d8;--danger:#dc3545;--success:#16834b;--border:#e5e7eb;--shadow:0 10px 30px rgba(16,24,40,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
    .auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef3ff,#f8fbff)}
    .auth-card{width:min(430px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:28px}.brand{text-align:center;margin-bottom:24px}.brand .logo{font-size:42px}.brand h1{margin:8px 0 4px;font-size:25px}.brand p{margin:0;color:var(--muted)}
    .tabs{display:flex;gap:8px;background:#f2f4f7;padding:5px;border-radius:12px;margin-bottom:18px}.tab{flex:1;padding:11px;border-radius:9px;background:transparent;color:var(--muted);font-weight:700}.tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:10px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(49,94,251,.12)}
    .btn{padding:11px 15px;border-radius:10px;font-weight:700}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}.btn-secondary{background:#eef2f6;color:#344054}.btn-danger{background:#fee4e6;color:#b42318}.btn-danger-strong{background:#dc3545;color:#fff}.btn-danger-strong:hover{background:#b42318}.btn-success{background:#e8f7ef;color:#067647}.btn-small{padding:7px 10px;font-size:12px}.full{width:100%}
    .message{padding:11px 13px;border-radius:10px;margin:12px 0;font-size:13px}.message.error{background:#fff0f1;color:#b42318}.message.success{background:#eaf8f0;color:#067647}.message.info{background:#eef4ff;color:#1d4ed8}
    .app{min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.topbar-title{font-weight:800}.userbox{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#e8edff;color:var(--primary);display:grid;place-items:center;font-weight:800}.layout{display:flex;min-height:calc(100vh - 68px)}.sidebar{width:230px;background:#fff;border-right:1px solid var(--border);padding:16px}.navbtn{width:100%;text-align:left;background:transparent;padding:11px 12px;border-radius:10px;color:#475467;margin-bottom:4px;font-weight:700}.navbtn.active,.navbtn:hover{background:#eef3ff;color:var(--primary)}.content{flex:1;padding:24px;max-width:1500px;margin:auto;width:100%;background:linear-gradient(180deg,#eaf1ff 0%,#f6f9ff 320px,#f6f9ff 100%)}
    .page-title{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.page-title h2{margin:0;font-size:24px}.page-title p{margin:4px 0 0;color:var(--muted);font-size:13px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 3px 15px rgba(16,24,40,.04)}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .value{font-size:28px;font-weight:800;margin-top:8px}.cards{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 3px 15px rgba(16,24,40,.04)}.card h3{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2f6;color:#475467}.status.active{background:#eaf8f0;color:#067647}.status.inactive{background:#f2f4f7;color:#667085}.response{margin-top:15px;padding-top:14px;border-top:1px solid var(--border)}.response-row{display:flex;gap:8px}.response-row .btn{flex:1}.locked{font-size:12px;color:#067647;font-weight:700;background:#eaf8f0;padding:9px;border-radius:9px}
    .panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full-span{grid-column:1/-1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafbfc}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:30px}.loader{position:fixed;inset:0;background:rgba(255,255,255,.65);display:grid;place-items:center;z-index:100}.spinner{width:40px;height:40px;border:4px solid #dbe2ff;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:18px;z-index:80}.modal-card{background:#fff;width:min(560px,100%);border-radius:18px;padding:20px;max-height:90vh;overflow-y:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0}.close{background:#f2f4f7;width:34px;height:34px;border-radius:50%;font-size:20px}
    @media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.sidebar{width:190px}}@media(max-width:680px){.layout{display:block}.sidebar{width:100%;border-right:0;border-bottom:1px solid var(--border);display:flex;overflow:auto;gap:5px}.navbtn{min-width:max-content;width:auto}.content{padding:16px}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.form-grid .full-span{grid-column:auto}.topbar{padding:0 14px}.topbar-title{font-size:14px}.userbox .user-name{display:none}}

    /* Welcome banner + dashboard widgets (mild blue tone to match the content area) */
    .welcome-card{background:linear-gradient(135deg,#eaf1ff,#dfe9ff);border:1px solid #d6e3ff;border-radius:18px;padding:22px 24px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
    .welcome-card h2{margin:0 0 4px;font-size:22px}.welcome-card p{margin:0;color:var(--muted);font-size:13px}
    .stat{border-top:3px solid var(--primary)}.stat.acc-green{border-top-color:var(--success)}.stat.acc-orange{border-top-color:#f59e0b}.stat.acc-red{border-top-color:var(--danger)}
    .dash-cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:18px}
    @media(max-width:900px){.dash-cols{grid-template-columns:1fr}}
    .mini-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mini-row:last-child{margin-bottom:0}
    .mini-row .mini-label{flex:0 0 140px;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-track{flex:1;height:9px;background:#eef2f6;border-radius:999px;overflow:hidden}
    .mini-fill{height:100%;background:linear-gradient(90deg,var(--primary),#7c9dff);border-radius:999px}
    .mini-count{flex:0 0 30px;text-align:right;font-size:12px;font-weight:800;color:var(--muted)}
    .activity-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
    .activity-item:last-child{border-bottom:0}.activity-item .who{font-weight:700}
    .link-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--primary);background:#eef3ff;padding:7px 10px;border-radius:8px;text-decoration:none}
    .link-btn:hover{background:#dfe8ff}
    .contest-closed{font-size:12px;color:#94a3b8;font-weight:800;background:#f2f4f7;padding:8px 10px;border-radius:8px;text-align:center}
  </style>
</head>
<body>
  <div id="loader" class="loader hidden"><div class="spinner"></div></div>

  <section id="authView" class="auth">
    <div class="auth-card">
      <div class="brand"><div class="logo">💻</div><h1>Student Coding & Hackathon Portal</h1><p>Contest registration and student services</p></div>
      <div class="tabs"><button id="studentTab" class="tab active" onclick="switchLogin('student')">Student</button><button id="authorityTab" class="tab" onclick="switchLogin('authority')">Authority</button></div>
      <div id="loginMessage"></div>
      <form id="studentLoginForm" onsubmit="loginStudentUI(event)">
        <div class="field"><label>Register Number</label><input id="studentReg" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input id="studentPass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary full" type="submit">Login as Student</button>
      </form>
      <form id="authorityLoginForm" class="hidden" onsubmit="loginAuthorityUI(event)">
        <div class="field"><label>Username</label><input id="authorityUser" autocomplete="username" required></div>
        <div class="field"><label>Password</label><input id="authorityPass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary full" type="submit">Login as Authority</button>
      </form>
    </div>
  </section>

  <section id="appView" class="app hidden">
    <header class="topbar"><div class="topbar-title">💻 Coding & Hackathon Portal</div><div class="userbox"><div class="avatar" id="avatar">U</div><div class="user-name" id="userName">User</div><button class="btn btn-secondary btn-small" onclick="logoutUI()">Logout</button></div></header>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="mainContent"></main>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Details</h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script>
  const state = { token: sessionStorage.getItem('portalToken') || '', type: sessionStorage.getItem('portalType') || '', user: null, currentPage: 'dashboard' };
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmtDate = v => v ? new Date(v).toLocaleString() : '-';
  const showLoader = v => $('loader').classList.toggle('hidden', !v);
  function showMsg(text, type = 'error', target = 'loginMessage') { $(target).innerHTML = `<div class="message ${type}">${esc(text)}</div>`; }
  function clearMsg(target = 'loginMessage') { $(target).innerHTML = ''; }

  // Use Apps Script URL for Apps Script deployment, or /api/server for Vercel proxy
  const API_URL = typeof google !== 'undefined' && google.script 
    ? 'https://script.google.com/macros/s/AKfycbzDEeTKOMr16aQXDjZFrBeHsrm0kmOkeucC-TxfQNQ5NaPmislvUAYzbAcIm3FJ5CSk/exec'
    : '/api/server';

  async function callServer(fn, ...args) {
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          fn: fn,
          args: args
        })
      });

      let result;
      try {
        result = await response.json();
      } catch (e) {
        console.error('Failed to parse response:', e);
        throw new Error('Invalid response from server. Please check the server configuration.');
      }

      if (!response.ok && (!result || result.success === false)) {
        throw new Error(result?.message || `Server error: ${response.status}`);
      }

      return result;
    } catch (error) {
      console.error('callServer error:', error);
      throw error;
    }
  }

  async function server(fn, ...args) {
    try {
      const r = await callServer(fn, ...args);

      if (!r || r.success !== true) {
        const m = r?.message || 'Server request failed.';
        throw new Error(m);
      }

      return r.data;
    } catch (e) {
      throw e;
    }
  }

  function forceLogin(msg) { 
    state.token = ''; 
    state.type = ''; 
    state.user = null; 
    sessionStorage.removeItem('portalToken'); 
    sessionStorage.removeItem('portalType'); 
    $('appView').classList.add('hidden'); 
    $('authView').classList.remove('hidden'); 
    if (msg) showMsg(msg, 'error'); 
  }

  function switchLogin(type) {
    $('studentTab').classList.toggle('active', type === 'student'); 
    $('authorityTab').classList.toggle('active', type === 'authority');
    $('studentLoginForm').classList.toggle('hidden', type !== 'student'); 
    $('authorityLoginForm').classList.toggle('hidden', type !== 'authority'); 
    clearMsg();
  }

  async function loginStudentUI(e) {
    e.preventDefault(); 
    clearMsg(); 
    showLoader(true);
    try { 
      const d = await server('loginStudent', $('studentReg').value.trim(), $('studentPass').value); 
      state.token = d.sessionToken; 
      state.type = 'STUDENT'; 
      state.user = d.student; 
      sessionStorage.setItem('portalToken', state.token); 
      sessionStorage.setItem('portalType', state.type); 
      openApp(); 
      await renderStudentDashboard(); 
    } catch (err) { 
      showMsg(err.message); 
    } finally { 
      showLoader(false); 
    }
  }

  async function loginAuthorityUI(e) {
    e.preventDefault(); 
    clearMsg(); 
    showLoader(true);
    try { 
      const d = await server('loginAuthority', $('authorityUser').value.trim(), $('authorityPass').value); 
      state.token = d.sessionToken; 
      state.type = 'AUTHORITY'; 
      state.user = d; 
      sessionStorage.setItem('portalToken', state.token); 
      sessionStorage.setItem('portalType', state.type); 
      openApp(); 
      await renderAuthorityDashboard(); 
    } catch (err) { 
      showMsg(err.message); 
    } finally { 
      showLoader(false); 
    }
  }

  function openApp() { 
    $('authView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    $('userName').textContent = state.type === 'STUDENT' ? (state.user.name || 'Student') : (state.user.name || state.user.username || 'Authority');
    $('avatar').textContent = ($('userName').textContent || 'U').charAt(0).toUpperCase(); 
    buildSidebar(); 
  }

  function buildSidebar() {
    const items = state.type === 'STUDENT' 
      ? [['dashboard', 'Dashboard', '🏠'], ['contests', 'Contests', '🏆'], ['requests', 'My Requests', '📝']]
      : [['dashboard', 'Dashboard', '🏠'], ['students', 'Students', '👥'], ['contests', 'Contests', '🏆'], ['requests', 'Requests', '📋']];
    $('sidebar').innerHTML = items.map(x => `<button class="navbtn ${state.currentPage === x[0] ? 'active' : ''}" onclick="navigate('${x[0]}')">${x[2]} &nbsp; ${x[1]}</button>`).join('');
  }

  async function navigate(page) { 
    state.currentPage = page; 
    buildSidebar(); 
    showLoader(true);
    try {
      if (state.type === 'STUDENT') {
        if (page === 'dashboard') await renderStudentDashboard();
        else if (page === 'contests') await renderStudentContests();
        else await renderStudentRequests();
      } else {
        if (page === 'dashboard') await renderAuthorityDashboard();
        else if (page === 'students') await renderStudents();
        else if (page === 'contests') await renderAuthorityContests();
        else await renderAuthorityRequests();
      }
    } catch (e) {
      $('mainContent').innerHTML = `<div class="message error">${esc(e.message)}</div>`;
    } finally {
      showLoader(false);
    }
  }

  // Shared card renderer used by both the dashboard "needs your response" preview
  // and the full Contests page, so they always stay in sync with each other.
  // Crucially, the Register button only ever appears for a contest whose status
  // is ACTIVE — if authority removes/deactivates a contest, students immediately
  // see "Closed" instead of a clickable Register button (the server also enforces
  // this independently, so a stale page or a direct API call can't register either).
  function contestCardHtml(c) {
    const isActive = c.status === 'ACTIVE';
    let actionHtml;
    if (c.studentResponse === 'YES') actionHtml = '<span class="locked">✓ Registered</span>';
    else if (c.studentResponse === 'NO') actionHtml = '<span style="font-size:12px;color:var(--muted)">Not interested</span>';
    else if (!isActive) actionHtml = '<span class="contest-closed">Closed</span>';
    else actionHtml = `<button class="btn btn-primary btn-small" onclick="registerContest('${esc(c.contestId)}')">Register</button>`;

    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="flex:1">
            <h3>${esc(c.contestName)}</h3>
            <p class="muted">${esc(c.description)}</p>
            <div style="margin-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:8px">
              <span class="status ${isActive ? 'active' : 'inactive'}">${esc(c.status)}</span>
              <span style="font-size:12px;color:var(--muted)">${c.registeredCount} registered</span>
              ${c.contestLink ? `<a class="link-btn" href="${esc(c.contestLink)}" target="_blank" rel="noopener">🔗 Visit Contest</a>` : ''}
            </div>
          </div>
          <div style="text-align:right">${actionHtml}</div>
        </div>
        ${c.studentResponse === 'YES' ? '<div class="locked" style="margin-top:10px">Your registration is locked and cannot be changed.</div>' : ''}
        ${!isActive && c.studentResponse === 'NO_RESPONSE' ? '<div class="contest-closed" style="margin-top:10px">This contest has been removed by the authority and is no longer accepting registrations.</div>' : ''}
      </div>
    `;
  }

  async function renderStudentDashboard() {
    const d = await server('getStudentDashboard', state.token);
    state.user = d.student;
    openApp();
    const pending = (d.contests || []).filter(c => c.status === 'ACTIVE' && c.studentResponse === 'NO_RESPONSE').slice(0, 3);
    const highlightCards = pending.map(contestCardHtml).join('');

    $('mainContent').innerHTML = `
      <div class="welcome-card">
        <div>
          <h2>Welcome, ${esc(d.student.name)}</h2>
          <p>Register No: ${esc(d.student.regNo)} · Year ${esc(d.student.year)} · ${esc(d.student.classSec)}</p>
        </div>
        <button class="btn btn-primary" onclick="navigate('contests')">🏆 Browse All Contests</button>
      </div>
      <div class="grid stats">
        <div class="stat acc-green">
          <div class="label">Registered Contests</div>
          <div class="value">${d.registeredCount}</div>
        </div>
        <div class="stat acc-red">
          <div class="label">Not Interested</div>
          <div class="value">${d.notRegisteredCount}</div>
        </div>
        <div class="stat acc-orange">
          <div class="label">No Response</div>
          <div class="value">${d.noResponseCount}</div>
        </div>
        <div class="stat">
          <div class="label">Total Contests</div>
          <div class="value">${d.contests.length}</div>
        </div>
      </div>
      <div class="page-title" style="margin-top:24px"><div><h2>Needs Your Response</h2><p>Active contests you haven't responded to yet</p></div></div>
      <div class="grid cards">${highlightCards || '<div class="empty">You\'re all caught up — no pending contests right now.</div>'}</div>
    `;
  }

  async function renderStudentContests() {
    const d = await server('getStudentDashboard', state.token);
    state.user = d.student;
    openApp();
    const cards = (d.contests || []).map(contestCardHtml).join('');
    $('mainContent').innerHTML = `
      <div class="page-title"><div><h2>Contests</h2><p>Browse every contest and manage your registration</p></div></div>
      <div class="grid cards">${cards || '<div class="empty">No contests available</div>'}</div>
    `;
  }

  async function registerContest(contestId) {
    showLoader(true);
    try {
      await server('submitContestResponse', state.token, contestId, 'YES');
      showMsg('Registered successfully!', 'success', 'mainContent');
      if (state.currentPage === 'contests') await renderStudentContests();
      else await renderStudentDashboard();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function renderStudentRequests() {
    const reqs = await server('getMyRequests', state.token);
    const items = reqs.map(r => `
      <tr>
        <td>${esc(r.requestId)}</td>
        <td>${esc(r.type)}</td>
        <td>${esc(r.requestedChange)}</td>
        <td><span class="status ${r.status === 'pending' ? 'active' : ''}">${esc(r.status)}</span></td>
        <td>${esc(r.authorityResponse)}</td>
      </tr>
    `).join('');

    $('mainContent').innerHTML = `
      <div class="page-title">
        <div><h2>My Requests</h2><p>View your correction requests and status</p></div>
        <button class="btn btn-primary" onclick="openRequestForm()">+ New Request</button>
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Request ID</th><th>Type</th><th>Change Requested</th><th>Status</th><th>Authority Response</th></tr></thead>
            <tbody>${items || '<tr><td colspan="5" class="empty">No requests found</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function openRequestForm() {
    $('modalTitle').textContent = 'New Correction Request';
    $('modalBody').innerHTML = `
      <form onsubmit="submitRequestUI(event)">
        <div class="field">
          <label>Request Type</label>
          <select id="reqType" required>
            <option value="">Select type...</option>
            <option value="Name Correction">Name Correction</option>
            <option value="Registration Number">Registration Number</option>
            <option value="Roll Number">Roll Number</option>
            <option value="Year">Year</option>
            <option value="Class/Section">Class/Section</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>Requested Change</label>
          <input id="reqChange" required>
        </div>
        <div class="field">
          <label>Reason</label>
          <textarea id="reqReason" required style="resize:vertical;min-height:80px"></textarea>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Submit Request</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
    $('modal').classList.remove('hidden');
  }

  async function submitRequestUI(e) {
    e.preventDefault();
    showLoader(true);
    try {
      await server('createCorrectionRequest', state.token, $('reqType').value, $('reqChange').value, $('reqReason').value);
      closeModal();
      showMsg('Request submitted successfully!', 'success', 'mainContent');
      await renderStudentRequests();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function renderAuthorityDashboard() {
    const d = await server('getAuthorityDashboard', state.token);
    state.user = d.authority;
    openApp();

    const maxReg = Math.max(1, ...(d.contestSummary || []).map(c => c.registeredCount), 1);
    const contestRows = (d.contestSummary || []).map(c => `
      <div class="mini-row">
        <div class="mini-label" title="${esc(c.contestName)}">${esc(c.contestName)}</div>
        <div class="mini-track"><div class="mini-fill" style="width:${Math.round((c.registeredCount / maxReg) * 100)}%"></div></div>
        <div class="mini-count">${c.registeredCount}</div>
      </div>
    `).join('');

    const reqItems = (d.recentRequests || []).map(r => `
      <div class="activity-item">
        <div><span class="who">${esc(r.studentName)}</span> · ${esc(r.type)}</div>
        <span class="status ${r.status === 'pending' ? 'active' : ''}">${esc(r.status)}</span>
      </div>
    `).join('');

    $('mainContent').innerHTML = `
      <div class="welcome-card">
        <div>
          <h2>Welcome back, ${esc(d.authority.name)}</h2>
          <p>Here's what's happening across the portal today</p>
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="quickAddStudent()">+ Add Student</button>
          <button class="btn btn-primary" onclick="quickAddContest()">+ Add Contest</button>
          <button class="btn btn-secondary" onclick="navigate('requests')">📋 Requests</button>
        </div>
      </div>
      <div class="grid stats">
        <div class="stat">
          <div class="label">Total Students</div>
          <div class="value">${d.totalStudents}</div>
        </div>
        <div class="stat acc-green">
          <div class="label">Active Contests</div>
          <div class="value">${d.activeContests}</div>
        </div>
        <div class="stat">
          <div class="label">Total Responses</div>
          <div class="value">${d.totalResponses}</div>
        </div>
        <div class="stat acc-orange">
          <div class="label">Pending Requests</div>
          <div class="value">${d.pendingRequests}</div>
        </div>
      </div>
      <div class="dash-cols">
        <div class="panel">
          <h3>Contest Registrations</h3>
          ${contestRows || '<div class="empty">No contests yet — create one to get started.</div>'}
        </div>
        <div class="panel">
          <h3>Recent Requests</h3>
          ${reqItems || '<div class="empty">No requests yet</div>'}
          <button class="btn btn-secondary btn-small full" style="margin-top:12px" onclick="navigate('requests')">View all requests</button>
        </div>
      </div>
    `;
  }

  // Dashboard shortcuts: these jump straight into the Add Student / Add Contest
  // form in one click, instead of just landing on the list page and making the
  // authority click "+ Add..." a second time. They first load the real list page
  // behind the modal (so the sidebar highlight and any post-submit refresh stay
  // correct), then open the modal on top of it.
  async function quickAddStudent() {
    state.currentPage = 'students';
    buildSidebar();
    showLoader(true);
    try {
      await renderStudents();
      openAddStudent();
    } catch (err) {
      $('mainContent').innerHTML = `<div class="message error">${esc(err.message)}</div>`;
    } finally {
      showLoader(false);
    }
  }

  async function quickAddContest() {
    state.currentPage = 'contests';
    buildSidebar();
    showLoader(true);
    try {
      await renderAuthorityContests();
      openAddContest();
    } catch (err) {
      $('mainContent').innerHTML = `<div class="message error">${esc(err.message)}</div>`;
    } finally {
      showLoader(false);
    }
  }

  async function renderStudents() {
    const students = await server('getStudents', state.token);
    const rows = students.map(s => `
      <tr>
        <td>${esc(s.rollNo)}</td>
        <td>${esc(s.year)}</td>
        <td>${esc(s.classSec)}</td>
        <td>${esc(s.regNo)}</td>
        <td>${esc(s.name)}</td>
        <td>
          <div class="actions">
            <button class="btn btn-secondary btn-small" onclick="openEditStudent('${esc(s.regNo)}', '${esc(s.rollNo)}', '${esc(s.year)}', '${esc(s.classSec)}', '${esc(s.name)}')">Edit</button>
            <button class="btn btn-danger btn-small" onclick="deleteStudentUI('${esc(s.regNo)}')">Delete</button>
            <button class="btn btn-secondary btn-small" onclick="resetPasswordUI('${esc(s.regNo)}')">Reset Pass</button>
          </div>
        </td>
      </tr>
    `).join('');

    $('mainContent').innerHTML = `
      <div class="page-title">
        <div><h2>Students</h2><p>Manage student records</p></div>
        <button class="btn btn-primary" onclick="openAddStudent()">+ Add Student</button>
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Roll No</th><th>Year</th><th>Class</th><th>Reg No</th><th>Name</th><th>Actions</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6" class="empty">No students found</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function openAddStudent() {
    $('modalTitle').textContent = 'Add New Student';
    $('modalBody').innerHTML = `
      <form onsubmit="addStudentUI(event)">
        <div class="form-grid">
          <div class="field"><label>Roll Number</label><input id="addRoll" required></div>
          <div class="field"><label>Year</label><input id="addYear" required></div>
          <div class="field"><label>Class/Section</label><input id="addClass" required></div>
          <div class="field"><label>Register Number</label><input id="addReg" required></div>
          <div class="field full-span"><label>Student Name</label><input id="addName" required></div>
          <div class="field full-span"><label>Password</label><input id="addPass" type="password" required></div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Add Student</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
    $('modal').classList.remove('hidden');
  }

  async function addStudentUI(e) {
    e.preventDefault();
    showLoader(true);
    try {
      await server('addStudent', state.token, {
        rollNo: $('addRoll').value,
        year: $('addYear').value,
        classSec: $('addClass').value,
        regNo: $('addReg').value,
        name: $('addName').value,
        password: $('addPass').value
      });
      closeModal();
      showMsg('Student added successfully!', 'success', 'mainContent');
      await renderStudents();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  function openEditStudent(regNo, roll, year, classSec, name) {
    $('modalTitle').textContent = 'Edit Student Details';
    $('modalBody').innerHTML = `
      <form onsubmit="saveEditedStudent(event, '${esc(regNo)}')">
        <div class="form-grid">
          <div class="field"><label>Roll Number</label><input id="editRoll" value="${esc(roll)}" required></div>
          <div class="field"><label>Year</label><input id="editYear" value="${esc(year)}" required></div>
          <div class="field"><label>Class/Section</label><input id="editClass" value="${esc(classSec)}" required></div>
          <div class="field"><label>Register Number</label><input id="editReg" value="${esc(regNo)}" required></div>
          <div class="field full-span"><label>Student Name</label><input id="editName" value="${esc(name)}" required></div>
        </div>
        <div class="message info" style="margin-top:10px">Password cannot be changed here. Use Reset Password option.</div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
    $('modal').classList.remove('hidden');
  }

  async function saveEditedStudent(e, originalRegNo) {
    e.preventDefault();
    showLoader(true);
    try {
      await server('editStudentDetails', state.token, originalRegNo, {
        rollNo: $('editRoll').value,
        year: $('editYear').value,
        classSec: $('editClass').value,
        regNo: $('editReg').value,
        name: $('editName').value
      });
      closeModal();
      showMsg('Student updated successfully!', 'success', 'mainContent');
      await renderStudents();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function deleteStudentUI(regNo) {
    if (!confirm('Are you sure you want to delete this student? This action cannot be undone.')) return;
    showLoader(true);
    try {
      await server('deleteStudent', state.token, regNo);
      showMsg('Student deleted successfully!', 'success', 'mainContent');
      await renderStudents();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function resetPasswordUI(regNo) {
    const newPass = prompt('Enter new password:');
    if (!newPass) return;
    showLoader(true);
    try {
      await server('resetStudentPassword', state.token, regNo, newPass);
      showMsg('Password reset successfully!', 'success', 'mainContent');
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function renderAuthorityContests() {
    const contests = await server('getContests', state.token);
    const rows = contests.map(c => `
      <tr>
        <td>${esc(c.contestName)}</td>
        <td><a href="${esc(c.contestLink)}" target="_blank">Link</a></td>
        <td>${esc(c.description)}</td>
        <td><span class="status ${c.status === 'ACTIVE' ? 'active' : 'inactive'}">${esc(c.status)}</span></td>
        <td>${c.registeredCount}</td>
        <td>
          <div class="actions">
            <button class="btn btn-secondary btn-small" onclick="viewAnalytics('${esc(c.contestId)}')">Analytics</button>
            <button class="btn btn-secondary btn-small" onclick="editContest('${esc(c.contestId)}')">Edit</button>
            ${c.status === 'ACTIVE' ? `<button class="btn btn-danger btn-small" onclick="deleteContestUI('${esc(c.contestId)}')" title="Hide from students but keep its data">Deactivate</button>` : ''}
            <button class="btn btn-danger-strong btn-small" onclick="deleteContestPermanentlyUI('${esc(c.contestId)}')" title="Remove completely — cannot be undone">Delete Forever</button>
          </div>
        </td>
      </tr>
    `).join('');

    $('mainContent').innerHTML = `
      <div class="page-title">
        <div><h2>Contests</h2><p>Manage contests</p></div>
        <button class="btn btn-primary" onclick="openAddContest()">+ Add Contest</button>
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Name</th><th>Link</th><th>Description</th><th>Status</th><th>Registered</th><th>Actions</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6" class="empty">No contests found</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function openAddContest() {
    $('modalTitle').textContent = 'Add New Contest';
    $('modalBody').innerHTML = `
      <form onsubmit="addContestUI(event)">
        <div class="field"><label>Contest Name</label><input id="contestName" required></div>
        <div class="field"><label>Contest Link</label><input id="contestLink" type="url" required></div>
        <div class="field"><label>Description</label><textarea id="contestDesc" style="resize:vertical;min-height:60px"></textarea></div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Add Contest</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
    $('modal').classList.remove('hidden');
  }

  async function addContestUI(e) {
    e.preventDefault();
    showLoader(true);
    try {
      await server('createContest', state.token, {
        contestName: $('contestName').value,
        contestLink: $('contestLink').value,
        description: $('contestDesc').value
      });
      closeModal();
      showMsg('Contest created successfully!', 'success', 'mainContent');
      await renderAuthorityContests();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function deleteContestUI(contestId) {
    if (!confirm('Are you sure? This will deactivate the contest.')) return;
    showLoader(true);
    try {
      await server('deleteContest', state.token, contestId);
      showMsg('Contest deactivated successfully!', 'success', 'mainContent');
      await renderAuthorityContests();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function deleteContestPermanentlyUI(contestId) {
    if (!confirm('This PERMANENTLY deletes the contest and removes it from both portals immediately — its analytics and registration count are lost and this cannot be undone. Continue?')) return;
    showLoader(true);
    try {
      await server('deleteContestPermanently', state.token, contestId);
      showMsg('Contest permanently deleted!', 'success', 'mainContent');
      await renderAuthorityContests();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  async function viewAnalytics(contestId) {
    showLoader(true);
    try {
      const a = await server('getContestAnalytics', state.token, contestId);
      $('modalTitle').textContent = 'Contest Analytics';
      $('modalBody').innerHTML = `
        <div style="padding:10px">
          <div class="stat"><div class="label">Total Students</div><div class="value">${a.totalStudents}</div></div>
          <div class="stat"><div class="label">Registered (YES)</div><div class="value" style="color:var(--success)">${a.yesCount}</div></div>
          <div class="stat"><div class="label">Not Interested (NO)</div><div class="value" style="color:var(--danger)">${a.noCount}</div></div>
          <div class="stat"><div class="label">No Response</div><div class="value">${a.noResponseCount}</div></div>
          <div class="stat"><div class="label">Registration %</div><div class="value">${a.registrationPercentage}%</div></div>
        </div>
      `;
      $('modal').classList.remove('hidden');
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  function editContest(contestId) {
    $('modalTitle').textContent = 'Edit Contest';
    $('modalBody').innerHTML = `<p>Edit functionality coming soon...</p>`;
    $('modal').classList.remove('hidden');
  }

  async function renderAuthorityRequests() {
    const reqs = await server('getAllRequests', state.token);
    const rows = reqs.map(r => `
      <tr>
        <td>${esc(r.requestId)}</td>
        <td>${esc(r.studentName)}</td>
        <td>${esc(r.type)}</td>
        <td>${esc(r.requestedChange)}</td>
        <td><span class="status ${r.status === 'pending' ? 'active' : ''}">${esc(r.status)}</span></td>
        <td>
          ${r.status === 'pending' ? `
            <button class="btn btn-success btn-small" onclick="processRequestUI('${esc(r.requestId)}', 'approve')">Approve</button>
            <button class="btn btn-danger btn-small" onclick="processRequestUI('${esc(r.requestId)}', 'reject')">Reject</button>
          ` : `${esc(r.authorityResponse)}`}
        </td>
      </tr>
    `).join('');

    $('mainContent').innerHTML = `
      <div class="page-title"><div><h2>Correction Requests</h2><p>Review and process student requests</p></div></div>
      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Request ID</th><th>Student</th><th>Type</th><th>Change</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6" class="empty">No requests found</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  async function processRequestUI(requestId, action) {
    const response = prompt(`Enter ${action === 'approve' ? 'approval' : 'rejection'} message:`);
    if (!response) return;
    showLoader(true);
    try {
      if (action === 'approve') {
        await server('approveRequest', state.token, requestId, response);
      } else {
        await server('rejectRequest', state.token, requestId, response);
      }
      showMsg(`Request ${action}d successfully!`, 'success', 'mainContent');
      await renderAuthorityRequests();
    } catch (err) {
      showMsg(err.message);
    } finally {
      showLoader(false);
    }
  }

  function closeModal() {
    $('modal').classList.add('hidden');
  }

  async function logoutUI() {
    showLoader(true);
    try {
      await server('logout', state.token);
    } catch (err) {
      console.error('Logout error (non-fatal):', err);
    }
    forceLogin('Logged out successfully');
    showLoader(false);
  }

  // Auto-login if session exists.
  // Note: renderStudentDashboard()/renderAuthorityDashboard() populate state.user
  // and call openApp() themselves once their data has loaded, so we don't call
  // openApp() here first — doing so used to run before state.user existed and
  // crashed on every page refresh, silently logging the user back out.
  window.addEventListener('load', async () => {
    if (state.token && state.type) {
      showLoader(true);
      try {
        if (state.type === 'STUDENT') {
          await renderStudentDashboard();
        } else {
          await renderAuthorityDashboard();
        }
      } catch (err) {
        console.error('Auto-login failed:', err);
        forceLogin('Session expired. Please login again.');
      } finally {
        showLoader(false);
      }
    }
  });
</script>
</body>
</html>
